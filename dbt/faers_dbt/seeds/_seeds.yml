version: 2

seeds:
  - name: seed_outcome_codes
    description: >
      FAERS patient outcome codes (OUTC file, outc_cod) with the meaning text of the FDA
      "ASC_NTS" file shipped in each quarterly ASCII zip (revision of January 2025). The same 7
      codes, and only these, appear in the 8 loaded quarters.
    config:
      column_types:
        outcome_code: varchar
        outcome_description: varchar
    columns:
      - name: outcome_code
        data_tests: [unique, not_null]

  - name: seed_role_codes
    description: >
      FAERS drug role codes (DRUG file, role_cod) with the meaning text of the FDA "ASC_NTS" file
      (revision of January 2025). DN (drug not administered) appears from 2024Q4 in the loaded
      data.
    config:
      column_types:
        role_code: varchar
        role_description: varchar
    columns:
      - name: role_code
        data_tests: [unique, not_null]

  - name: seed_known_signals
    description: >
      Known drug-reaction pairs for validating the signal marts: positive pairs with an
      established association and negative controls chosen for clinical implausibility. Names
      are the exact dim_ingredient.ingredient_name (RxNorm) and dim_reaction.reaction_pt (MedDRA
      PT). reference names the FDA label and its sections (labels consulted on 2026-10-29);
      reference_status says where the pair stands in the label: label_boxed_warning,
      label_warning (Warnings and Precautions), label_monitoring (a laboratory value the label
      tells to monitor, not a listed adverse reaction) or label_not_listed (not in the label's
      adverse reactions, which is not proof that no association exists). Checked by
      mart_known_signals_eval.
    config:
      column_types:
        ingredient_name: varchar
        reaction_pt: varchar
        expected: varchar
        reference: varchar
        reference_status: varchar
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ingredient_name, reaction_pt]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(trim(reference)) > 0"
    columns:
      - name: ingredient_name
        data_tests: [not_null]
      - name: reaction_pt
        data_tests: [not_null]
      - name: expected
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, negative]
      - name: reference
        data_tests: [not_null]
      - name: reference_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [label_boxed_warning, label_warning, label_monitoring, label_not_listed]
