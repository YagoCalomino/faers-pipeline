version: 2

seeds:
  - name: seed_outcome_codes
    description: >
      FAERS patient outcome codes (OUTC file, outc_cod) with the meaning text of the FDA
      "ASC_NTS" file shipped in each quarterly ASCII zip (revision of January 2025). The same 7
      codes, and only these, appear in the 8 loaded quarters.
    config:
      column_types:
        outcome_code: varchar
        outcome_description: varchar
    columns:
      - name: outcome_code
        data_tests: [unique, not_null]

  - name: seed_role_codes
    description: >
      FAERS drug role codes (DRUG file, role_cod) with the meaning text of the FDA "ASC_NTS" file
      (revision of January 2025). DN (drug not administered) appears from 2024Q4 in the loaded
      data.
    config:
      column_types:
        role_code: varchar
        role_description: varchar
    columns:
      - name: role_code
        data_tests: [unique, not_null]

  - name: seed_known_signals
    description: >
      Known drug-reaction pairs for validating the signal marts (Phase 7): positive pairs with an
      established association and negative controls, chosen by the project owner. Names are the
      exact dim_ingredient.ingredient_name (RxNorm) and dim_reaction.reaction_pt (MedDRA PT).
      reference holds the literature or label source once the owner fills it in; until then
      reference_status is pending_user_confirmation. Checked by mart_known_signals_eval.
    config:
      column_types:
        ingredient_name: varchar
        reaction_pt: varchar
        expected: varchar
        reference: varchar
        reference_status: varchar
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ingredient_name, reaction_pt]
    columns:
      - name: ingredient_name
        data_tests: [not_null]
      - name: reaction_pt
        data_tests: [not_null]
      - name: expected
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, negative]
      - name: reference_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pending_user_confirmation, confirmed]
