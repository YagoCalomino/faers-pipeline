# Every value comes from the environment, set by scripts/dbt_run.py from config/faers.yaml.
# memory_limit and temp_directory go in config_options (applied once, at duckdb.connect), not in
# settings: dbt-duckdb 1.11 re-runs `SET <setting>` on every new cursor, and DuckDB refuses
# `SET temp_directory` once spill files exist ("Cannot switch temporary directory after the
# current one has been used"), which failed builds intermittently after a spill.
faers_dbt:
  target: duckdb_local
  outputs:
    duckdb_local:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH') }}"
      threads: "{{ env_var('DBT_THREADS') | as_number }}"
      config_options:
        memory_limit: "{{ env_var('DBT_MEMORY_LIMIT') }}"
        temp_directory: "{{ env_var('DUCKDB_TEMP_DIR') }}"
        # No model relies on row order; DuckDB keeps less in memory without it (2026-10-26: the
        # signal marts ran out of memory at 2.5 GB with it on).
        preserve_insertion_order: false
    ci:
      # Test lake and database in a throwaway folder (DBT_CI_DIR); never touches data/.
      type: duckdb
      path: "{{ env_var('DBT_CI_DIR') }}/faers_ci.duckdb"
      threads: "{{ env_var('DBT_THREADS') | as_number }}"
      config_options:
        memory_limit: "{{ env_var('DBT_MEMORY_LIMIT') }}"
        temp_directory: "{{ env_var('DBT_CI_DIR') }}/duckdb_tmp"
        preserve_insertion_order: false
