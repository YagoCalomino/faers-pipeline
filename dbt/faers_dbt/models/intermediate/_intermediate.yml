version: 2

models:
  - name: int_faers__case_latest
    description: >
      One row per caseid (deduplication): highest case_version, then latest fda_date, then
      latest source_quarter, then highest primaryid. Deleted cases removed entirely.
      init_quarter is the quarter of init_fda_date (first receipt by FDA).
    columns:
      - name: caseid
        data_tests: [unique, not_null]
      - name: primaryid
        data_tests: [not_null]
      - name: source_quarter
        data_tests: [not_null]

  - name: int_faers__drug_latest
    description: >
      DRUG rows of the winning (primaryid, source_quarter) of each case. drug_line_seq numbers
      the lines of one drug position (dosage regimens).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [caseid, drug_seq, drug_line_seq]
    columns:
      - name: caseid
        data_tests: [not_null]

  - name: int_faers__reaction_latest
    description: REAC rows of the winning (primaryid, source_quarter) of each case.
    columns:
      - name: caseid
        data_tests: [not_null]

  - name: int_faers__outcome_latest
    description: OUTC rows of the winning (primaryid, source_quarter) of each case.
    columns:
      - name: caseid
        data_tests: [not_null]

  - name: int_faers__drug_resolved
    description: >
      Drug lines of the winning versions with their ingredients (int_faers__drug_latest joined
      to the RxNorm name map on drug_text_clean). A combination line has one row per
      ingredient: count cases per ingredient with count(distinct caseid). Lines whose text is
      not in the map get the fallback ingredient FB:<drug_text_clean>.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [caseid, drug_seq, drug_line_seq, ingredient_id]
    columns:
      - name: caseid
        data_tests: [not_null]
      - name: ingredient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ingredient')
                field: ingredient_id
      - name: match_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [exact, normalized, approx_accepted, fallback]
