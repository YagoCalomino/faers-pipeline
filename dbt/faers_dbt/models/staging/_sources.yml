version: 2

sources:
  - name: faers_raw
    description: >
      FAERS quarterly ASCII files parsed to Parquet by the faers_ingest DAG (all columns text,
      plus _source_file and _ingested_at). Partitioned as quarter=YYYYQn.
    config:
      meta:
        # dbt-duckdb 1.11 reads external_location from the source meta; '{name}' is replaced
        # by the table name. meta sits under config (the layout the v2 parser accepts).
        external_location: >-
          read_parquet('{{ env_var('LAKE_PATH') }}/raw/faers/{name}/quarter=*/{name}.parquet',
          hive_partitioning = true)
    tables:
      - name: demo
      - name: drug
      - name: reac
      - name: outc
      - name: indi
      - name: deleted
        description: Case ids FDA removed (Deleted/DELETEyyQq.txt); one caseid per row.

  - name: rxnorm_raw
    description: >
      RxNorm lookups written by the rxnorm_enrich DAG (no DuckDB writes). term_lookup is the
      cache (one row per lookup term and ingredient); name_map is derived from it (one row per
      cleaned drug text and ingredient). Both are single Parquet files replaced atomically.
    tables:
      - name: term_lookup
        config:
          meta:
            external_location: >-
              read_parquet('{{ env_var('LAKE_PATH') }}/raw/rxnorm/cache/term_lookup.parquet')
      - name: name_map
        config:
          meta:
            external_location: >-
              read_parquet('{{ env_var('LAKE_PATH') }}/raw/rxnorm/name_map/name_map.parquet')
