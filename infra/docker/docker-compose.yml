# Based on the official Airflow 3.3.2 docker-compose.yaml
# (https://airflow.apache.org/docs/apache-airflow/3.3.2/docker-compose.yaml),
# reduced to LocalExecutor: postgres, airflow-init, api-server, scheduler, dag-processor.
# No Celery, Redis, Flower or triggerer.
#
# Local development only. Run from the repo root via `make up`
# (relative paths below are resolved from this file's directory).
name: faers-pipeline

x-airflow-common:
  &airflow-common
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
  image: faers-pipeline/airflow:3.3.2
  env_file:
    - path: ../../.env
      required: false
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Airflow's own config stays inside the container; ./config holds pipeline YAML only.
    AIRFLOW_CONFIG: '/opt/airflow/airflow.cfg'
    # Pipeline
    PYTHONPATH: /opt/airflow/src
    FAERS_CONFIG_DIR: /opt/airflow/config
    DBT_VENV: /opt/dbt-venv
  volumes:
    - ../../dags:/opt/airflow/dags
    - ../../src:/opt/airflow/src
    - ../../config:/opt/airflow/config
    - ../../dbt:/opt/airflow/dbt
    - ../../data:/opt/airflow/data
    - ../../logs:/opt/airflow/logs
    - ../airflow:/opt/airflow/infra:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      # Loopback only: the UI is not reachable from the local network.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs /opt/airflow/data/landing /opt/airflow/data/lake /opt/airflow/data/warehouse
        echo "Airflow version (also runs DB migration and creates the admin user):"
        /entrypoint airflow version
        echo "Importing pools from /opt/airflow/infra/pools.json"
        _AIRFLOW_DB_MIGRATE=false _AIRFLOW_WWW_USER_CREATE=false \
          /entrypoint airflow pools import /opt/airflow/infra/pools.json
        echo "Changing ownership of logs and data to ${AIRFLOW_UID:-50000}:0"
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/data
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  # One-off container for lint/tests (`make lint`, `make test`). Mounts the whole repo.
  airflow-dev:
    <<: *airflow-common
    profiles:
      - dev
    entrypoint: []
    working_dir: /opt/project
    volumes:
      - ../..:/opt/project
      # Same data path as the Airflow services, so config/*.yaml paths work here too.
      - ../../data:/opt/airflow/data
    environment:
      <<: *airflow-common-env
      PYTHONPATH: /opt/project/src
      FAERS_CONFIG_DIR: /opt/project/config
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      # Lint/tests never touch the metadata DB.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow-test.db
      RUFF_CACHE_DIR: /tmp/ruff-cache
    command: ["pytest"]
    depends_on: {}

volumes:
  postgres-db-volume:
