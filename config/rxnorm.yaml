# RxNorm enrichment. Values confirmed on 2026-10-23 on the official NLM pages:
#   Terms of service: https://lhncbc.nlm.nih.gov/RxNav/TermsofService.html
#   RxNorm API list:  https://lhncbc.nlm.nih.gov/RxNav/APIs/RxNormAPIs.html
#   (one page per function: https://lhncbc.nlm.nih.gov/RxNav/APIs/api-RxNorm.<function>.html)
api:
  base_url: "https://rxnav.nlm.nih.gov/REST"
  # Documented limit: "no more than 20 requests per second per IP address" (100 with a UTS
  # API key, not used here). Measured 2026-10-23: ~150 ms per call, all HTTP 200 at 2 req/s.
  rate_limit_rps: 5
  request_timeout_s: 30
  user_agent: "faers-pipeline-portfolio"
  retry:
    max_attempts: 4
    backoff_initial_s: 2
    backoff_multiplier: 2
    retry_on_status: [429, 500, 502, 503, 504]
  # Stop a lookup chunk after this many terms in a row end in error (API down): the task fails
  # and Airflow retries it; terms already resolved in the chunk are kept.
  max_consecutive_term_errors: 5
  # Templates: {term} and {rxcui} are URL-encoded by the client. Checked on 2026-10-26 against
  # the function pages linked above and with real calls (data/spikes/rxnorm_combinations.json).
  endpoints:
    # findRxcuiByString. search=0: exact match only (case is ignored); search=1: normalized
    # match (word order, punctuation, inflections and salt forms ignored). Two calls so the
    # layer (exact / normalized) is known; search=2 would not say which one matched.
    find_exact: "/rxcui.json?name={term}&search=0"
    find_normalized: "/rxcui.json?name={term}&search=1"
    # getApproximateMatch. maxEntries 1-100 (default 20); option=1 searches atoms of Active
    # concepts only (0, the default, searches Current concepts). Scores are documented as
    # comparable only "among a given set of results".
    approximate: "/approximateTerm.json?term={term}&maxEntries=5&option=1"
    # getRelatedByType, tty=IN. If the RxCUI is itself an IN it is "returned as the sole result".
    related_ingredients: "/rxcui/{rxcui}/related.json?tty=IN"
    # getRxNormVersion: {"version": "05-Oct-2026", "apiVersion": "3.1.356"}.
    version: "/version.json"

# Lookup scope and batching (rxnorm_enrich DAG).
lookup:
  # Names: cleaned prod_ai (upper, trim, inner whitespace collapsed; same as the dbt key) of the
  # DRUG lines whose role is in signals.yaml signal_drug_roles, most frequent first.
  # A backslash separates the ingredients of a combination in FAERS prod_ai (2026-10-26 profile:
  # 2,523 of 8,316 PS/SS names). Each part is looked up on its own; '/', ',', 'AND' and '+' are
  # part of single substance names (vaccine strains, "ESTROGENS, CONJUGATED") and are not split.
  combination_separator: "\\"
  chunk_size: 250          # terms per mapped task
  # Results are written to cache/_pending every N terms of a chunk (atomic files), so an
  # interrupted task loses at most N lookups; a retry skips the terms already written.
  flush_every_terms: 25
  # Names per run, most frequent first; null = every name in scope (a DAG param can lower it).
  max_names: null
  random_seed: 42          # used when a run selects names at random (calibration samples)

cache:
  # One file, term_lookup.parquet: one row per (lookup term, ingredient); status matched,
  # not_found or error. Chunk results land in cache/_pending/ and are merged atomically.
  path: "/opt/airflow/data/lake/raw/rxnorm/cache"
  # No automatic expiry. Every entry is stamped with the RxNorm version (version endpoint) at
  # lookup time; refreshing is a manual decision (e.g. after a new RxNorm release).
  # The NLM terms recommend "caching results for a 12-24 hour period" to limit requests;
  # whether that is meant as a minimum or a maximum was not confirmed.
  expiry: none
  stamp_with_rxnorm_version: true
  refresh: manual

# Match layers, tried in this order; the layer is stored as match_type.
match_layers:
  - exact            # find_by_name hit on the exact string
  - normalized       # find_by_name hit only after RxNorm normalization (search=2)
  - approx_accepted  # approximate candidate that passes approximate_rules
  - fallback         # no accepted match: the normalized text itself becomes the "ingredient"

approximate_rules:
  source: RXNORM                   # ignore candidates from other sources (MMSL, VANDF, ...)
  require_ingredient: true         # the candidate must resolve to at least one IN
  # Calibrated 2026-10-26 on a manually labelled sample (docs/calibration/rxnorm_calibration_sample.csv):
  # 6 of 20 approximate matches correct; no score threshold separates right from wrong (wrong
  # matches at 8.0-12.9 and 20.7, right ones at 10.1-15.3). Approximate matching is off: null
  # never accepts, so these terms fall back to their own text.
  min_score: null

# Name map derived from the cache: one row per (drug_text_clean, ingredient_rxcui).
name_map:
  path: "/opt/airflow/data/lake/raw/rxnorm/name_map"

# Generic class words that FAERS reports as an "ingredient" (no single RxNorm ingredient). They
# stay as fallback ingredients FB:<term>; dbt flags them with is_generic_fallback. Editable list
# of cleaned terms (upper case); dbt reads it through scripts/dbt_run.py.
generic_terms:
  - HERBALS
  - VITAMINS
  - MINERALS
  - DIETARY SUPPLEMENT
  - UNSPECIFIED INGREDIENT
  - DEVICE

coverage:
  min_ps_ss_row_coverage: 0.85     # quality gate; measured 99.05% on 2026-10-26 (8 quarters)

# Required statement, copied from https://lhncbc.nlm.nih.gov/RxNav/TermsofService.html
# ("We request that any application that makes use of NLM data include the following
# statement"). The same page says the NLM name and/or logo may not be used.
attribution_text: >-
  This product uses publicly available data from the U.S. National Library of Medicine (NLM),
  National Institutes of Health, Department of Health and Human Services; NLM is not
  responsible for the product and does not endorse or recommend this or any other product.
