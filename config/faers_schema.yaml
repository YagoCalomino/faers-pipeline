# Required columns per file type (lowercase). Missing column = failure. Extra column = warning.
# Post-2014Q3 layout, checked against the 2024Q3 and 2026Q2 zips in Phase 0.
demo: [primaryid, caseid, caseversion, i_f_code, event_dt, fda_dt, age, age_cod, age_grp, sex, reporter_country]
drug: [primaryid, caseid, drug_seq, role_cod, drugname, prod_ai]
reac: [primaryid, caseid, pt]
outc: [primaryid, caseid, outc_cod]
rpsr: [primaryid, caseid, rpsr_cod]
ther: [primaryid, caseid, dsg_drug_seq, start_dt, end_dt]
indi: [primaryid, caseid, indi_drug_seq, indi_pt]
deleted: [caseid]   # Deleted/DELETEyyQq.txt has no header; the parser names the column
