source:
  name: faers
  # Confirmed 2026-10-19: ranged GET on faers_ascii_2026q2.zip returned 206 with zip magic
  # bytes "PK\x03\x04" (63,223,614 bytes). Missing quarters (2026q3) return 404 on GET
  # but 500 on HEAD, and HEAD reports Content-Length 0, so availability uses a ranged GET.
  # The FDA page now says AEMS; this download path still works.
  base_url: "https://fis.fda.gov/content/Exports"
  filename_pattern: "faers_ascii_{year}q{q}.zip"
  landing_page: "https://www.fda.gov/drugs/fda-adverse-event-reporting-system-faers/fda-adverse-event-reporting-system-faers-latest-quarterly-data-files"
  request_timeout_s: 120
  user_agent: "faers-pipeline-portfolio"

schedule:
  # The 8 MVP quarters: 2024Q3 to 2026Q2 (both ends included). Checked 2026-10-23:
  # 2024Q3 and 2026Q2 zips downloaded; 2026Q3 not yet published.
  start_quarter: "2024Q3"
  end_quarter: "2026Q2"
  cron: "0 0 1 */3 *"
  max_active_runs: 2

availability_sensor:
  poke_interval_s: 21600     # 6 h
  timeout_s: 2592000         # 30 days

file_types: [demo, drug, reac, outc, rpsr, ther, indi]

# Case ids FDA removed from the database. Not one of file_types: own parser and task.
# Seen in 2024Q3 and 2026Q2 as Deleted/DELETE24Q3.txt and Deleted/DELETE26Q2.txt:
# no header, one caseid per line, first line blank.
deleted:
  member_pattern: "Deleted/DELETE{yy}Q{q}.txt"   # matched case-insensitively

parse:
  delimiter: "$"
  quote: ""
  encoding: "utf-8"
  fallback_encoding: "latin-1"
  # Applied with SET on each DuckDB connection of the parse. Phase 0 measured a peak RSS of
  # ~1.5-1.6 GB for DRUG with no limit and 12 threads.
  duckdb:
    memory_limit: "1500MB"
    threads: 2
    temp_directory: "/opt/airflow/data/tmp/duckdb"   # spill files; one subfolder per process

paths:
  landing: "/opt/airflow/data/landing/faers"
  lake: "/opt/airflow/data/lake"
  ingest_log: "/opt/airflow/data/lake/_meta/faers/ingest_log.jsonl"   # append-only
  warehouse: "/opt/airflow/data/warehouse/faers.duckdb"

# dbt (Phase 3). dbt is the only writer of paths.warehouse. The DuckDB file stays on the bind
# mount: a 2026-10-24 benchmark (CTAS of DEMO + DRUG, 8 quarters) showed no write gain from a
# named Docker volume (68-82 s vs 79-82 s), only ~1 s faster cold reads.
dbt:
  threads: 2
  memory_limit: "3GB"
  temp_directory: "/opt/airflow/data/tmp/duckdb"
  ci:                       # target ci: the test lake built from tests/fixtures/faers_sample
    threads: 2
    memory_limit: "1GB"
