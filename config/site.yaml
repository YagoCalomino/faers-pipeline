# Static site. faers_pipeline.export copies the site's data out of the warehouse
# (make export; DAG publish_site), faers_pipeline.site_check validates it, and site/ builds the
# pages from it (make publish-site). The site reads only these files, never the warehouse.
export:
  # Replaced as a whole on every run (built in a sibling folder, then swapped in).
  out_dir: "/opt/airflow/data/site_export"
  # publish_site writes here first and swaps into out_dir only after validation passes, so a
  # failed validation keeps the previous export.
  candidate_dir: "/opt/airflow/data/site_export.candidate"
  # Written beside out_dir only when publish_site validated the export: it records the sha256
  # of manifest.json, and make publish-site refuses an export whose manifest differs.
  ready_marker: "/opt/airflow/data/site_export.ready.json"
  # parquet: one file per table in parquet_tables, published as open-data downloads.
  # json: one file per ingredient with its pairs, plus small lookup files, read by the pages.
  formats: [parquet, json]
  # Tables with MedDRA reaction terms (signals_top, known_signals) are not offered as
  # downloads (docs/adr/0004-meddra-terms.md); the pages read them from json/.
  parquet_tables: [ingredients, dq_metrics]
  parquet_compression: zstd
  # Significant digits of doubles in JSON. 17 keeps every double exactly (round trip), so the
  # pages show the same numbers as the warehouse; fewer digits also round counts stored as
  # doubles (mart_dq_metrics.value).
  json_float_digits: 17
  # Generic fallback ingredients (HERBALS, VITAMINS, DEVICE, ...; config/rxnorm.yaml
  # generic_terms) stay out of the site by default. mart_signals_top already leaves them out,
  # so true only matters if that model changes.
  include_generic_fallback: false

# Checks of the export (publish_site validate_export) and of the built site (make publish-site).
# GitHub Pages limits read 2026-10-26 on docs.github.com: published site at most 1 GB; git
# blocks files over 100 MiB. The limits below are the project's own, well under those.
limits:
  export_max_total_bytes: 200000000
  export_max_file_bytes: 20000000
  export_max_files: 10000
  dist_max_total_bytes: 300000000
  dist_max_file_bytes: 25000000
  dist_max_files: 10000

site:
  title: "FAERS disproportionality explorer"
  # GitHub Pages project site: https://<user>.github.io/<repo>/. Links inside the site are
  # relative, so the base path is used only to print the public URL and to check the build.
  github_user: "YagoCalomino"
  repo: "faers-pipeline"
  base_path: "/faers-pipeline/"
  public_url: "https://yagocalomino.github.io/faers-pipeline/"
  repo_url: "https://github.com/YagoCalomino/faers-pipeline"
  # Branch written by make publish-site (orphan, one commit). Pushing it is a manual step.
  pages_branch: "gh-pages"
  # Source of the data, shown in the footer; the link is config/faers.yaml source.landing_page.
  fda_source_name: "FDA Adverse Event Reporting System (FAERS), now the FDA Adverse Event Monitoring System (AEMS)"
  # Shown in the footer and on the Downloads page (and in the README). See docs/adr/0004.
  meddra_notice: "Reaction terms are MedDRA® Preferred Terms as reported in FDA FAERS. MedDRA® is a registered trademark of the International Council for Harmonisation of Technical Requirements for Pharmaceuticals for Human Use (ICH). This project does not distribute the MedDRA dictionary and does not offer a downloadable dataset of MedDRA terms. Reaction terms (Preferred Terms) are shown on the site pages as they appear in FAERS."
  # External pages the site may link to (hyperlinks only; no external resource is loaded).
  allowed_link_prefixes:
    - "https://github.com/YagoCalomino/faers-pipeline"
    - "https://www.fda.gov/"
  # Pairs shown per ingredient page before "show all". An ingredient has at most 30 pairs (top 20
  # by ROR lower bound and top 10 by cases, config/signals.yaml top), so 30 shows them all; the
  # button appears only if that union grows.
  pairs_page_size: 30

# Concentration alert on a pair (ALL period, over the pair's a cases; mart_signals_top). A
# reporting artefact is suspected when any rule holds:
#   - quarter: at least min_cases_for_quarter_rule cases and min_top_quarter_share of them in
#     one init quarter (with 3 to 7 cases one quarter easily holds 100%);
#   - long reports: median reactions per report at least min_median_reactions_per_case;
#   - country: at least min_cases_for_country_rule cases, min_top_country_share of them from
#     one country, and that country is not the ingredient's most frequent one (blank and
#     placeholder countries left out of both). A share alone is not an alert: most FAERS reports
#     come from the US, so the pair is compared with its own ingredient.
# Calibrated 2026-10-27 on the export of 61,618 pairs: the first rule (0.8 without a minimum,
# median >= 20) flagged 42.1% of the rows; quarter and long reports 19.1%; with the country
# rule 23.3% (docs/limitations.md, "Concentration alert").
concentration_alert:
  min_top_quarter_share: 0.8
  min_cases_for_quarter_rule: 10
  min_median_reactions_per_case: 40
  min_top_country_share: 0.9
  min_cases_for_country_rule: 10

# Method & limitations page (#/method): the level-2 sections ("## ...") of docs/limitations.md
# rendered on the site, by exact heading. The text before the first section is always kept.
# Other sections, such as "Operational limits" (local paths, the Windows bind mount, failure
# callbacks), stay in the repository only. The build fails if a listed heading is missing.
method_page:
  sections:
    - "Signals (PRR, ROR)"
    - "RxNorm normalization of drug names"
    - "MedDRA terms"

# Descriptions of the open-data downloads (parquet/<table>.parquet), one per table in
# export.parquet_tables. Every exported column must have a description here (checked by
# validate_export).
downloads:
  ingredients:
    description: "One row per ingredient shown on the site (generic fallbacks left out)."
    columns:
      ingredient_key: "Surrogate key of the ingredient (dim_ingredient)."
      ingredient_id: "RxNorm ingredient RxCUI, or FB:<text> for a name without an RxNorm match."
      ingredient_name: "Ingredient name (RxNorm), or the cleaned FAERS text for a fallback."
      slug: "URL-safe name used in the site's links (#/ingredient/<slug>)."
      match_type: "Best RxNorm match observed for the ingredient: exact, normalized or fallback."
      is_fallback: "True when the ingredient has no RxNorm match."
      is_generic_fallback: "True for a class of products (HERBALS, VITAMINS, ...)."
      n_cases_ps_ss: "Distinct cases with the ingredient as primary or secondary suspect."
      n_pairs: "Number of pairs of the ingredient shown on the site."
  dq_metrics:
    description: "Data-quality metrics of the pipeline (raw rows, deduplication, missing values, RxNorm coverage, drug role mix)."
    columns:
      period_basis: "all, file_quarter (quarter of the FAERS file) or init_quarter (first receipt by FDA)."
      period_key: "Quarter (YYYYQn) or ALL."
      metric_group: "raw_rows, deduplication, missing_values, rxnorm_coverage or role_mix."
      metric: "Metric name."
      value: "Metric value."
      unit: "rows, cases, lines or pct."
